# TOP-12 — dynamic-environment RL training on Mumford0 (batch_size=1).
#
# Larger, slower-saturating instance than Mandl (30 nodes, 12-route benchmark,
# route len 2..15) so induced demand has horizon to act before the network
# saturates the cost floor. Same closed induced-demand loop + integrated reward
# as ppo_citybuilder_mandl; only the instance/route-geometry/horizon differ.
#
# Run (GPU):
#   modal run --detach modal_runs/train_static_holliday.py::rl_alpha_ablation \
#       --config-name=ppo_citybuilder_mumford0

ppo:
  n_iterations: 300       # runs converge by ~125-150 then drift/plateau; 300
                          # is a safe buffer above the peak (best-model select
                          # keeps the peak). ~2.5x faster than the old 750.
  val_period: 25
  n_epochs: 2             # was 4; halve update-phase GNN passes. FeatureNorm
                          # unfreeze is the real stabilizer, so fewer epochs ok.
  minibatch_size: 32
  horizon: 400             # step cap; larger instance => longer routes/episodes
  epsilon: 0.2
  use_gae: true
  gae_lambda: 0.95
  # Pool episodes per update to cut gradient variance (was unset -> 1, which
  # drove divergence). 2 is enough now that the FeatureNorm unfreeze is the
  # real stabilizer; halves rollout cost vs 4.
  n_episodes_per_iter: 2

discount_rate: 0.95
diff_reward: true
baseline_lr: 0.0005
# Critic (value-net) stabilization under non-stationary induced demand.
# baseline_grad_clip: max grad-norm for the value net (prevents the +/-1000
#   baseline blow-ups). null disables. baseline_loss: 'huber' (robust to outlier
#   returns) or 'mse' (original).
baseline_grad_clip: 10.0
baseline_loss: huber
baseline_input_clamp: 5.0   # bound the critic's normalized inputs (+/-5) so a
                            # lagging FeatureNorm can't feed the MLP extreme demand
                            # features -> stops the baseline +/-1000 spikes. null
                            # to disable. THE fix for the forward-magnitude blow-up.
entropy_weight: 0.01
batch_size: 1
# Scale RL rewards/returns/value targets off the ~100 cost magnitude so the
# NNBaseline critic and GAE deltas stay well-conditioned. Does NOT affect the
# logged welfare_gain/integrated_welfare metrics (computed from raw costs).
reward_scale: 0.01
# Running return normalization: divide rewards by the running std of the
# discounted return so the critic fits unit-scale targets (advantages are still
# batch-normalized, so the policy gradient is unaffected). Off by default;
# helps under the spiky/non-stationary build-then-watch reward.
reward_norm: false
# lr was Optuna-tuned on Mandl (small instance, small costs); too hot for
# Mumford0's larger rewards/gradients -> divergence. Lowered to 3e-4.
lr: 0.0003
decay: 0.0008404361781997002
optimizer: Adam

# Our induced-demand land-use dynamics (NOT Holliday's cost-weight alpha).
city_builder:
  alpha: 0.5               # induced-demand strength (swept by the ablation)
  beta_gravity: 2.0
  cap_multiplier: 3.0
  sigma_eps: 0.0
  # Induced-demand dynamics shaping. Defaults reproduce the original
  # multiplicative, x_0-proportional-cap behavior (rich-get-richer: demand
  # concentrates on already-busy zones, leaving little for anticipation to win).
  cap_mode: proportional   # used only when cap_blend is null. 'proportional' =
                           # cap 3*x_0 (orig); 'uniform' = cap 3*mean(x_0).
  cap_blend: null          # if set in [0,1], OVERRIDES cap_mode: basis =
                           # lambda*x_0 + (1-lambda)*mean(x_0). 1.0=proportional,
                           # 0.0=uniform, ~0.5=keep core dominant but give the
                           # periphery room. The knob swept first.
  add_rate: 0.0            # size-INDEPENDENT accessibility growth
                           # (add_rate*alpha*A_tilde*mean_x0): connecting an
                           # underserved zone injects demand greedy didn't foresee.
                           # Default 0 = original dynamics. For the cap_blend sweep,
                           # hold this fixed at >0 (e.g. 0.5) via an override, since
                           # the cap only bites if growth pushes zones toward it.
  # Build-years T (one route/year, == n_routes_to_plan). Configurable and
  # decoupled from the benchmark route count below; set to the benchmark size so
  # the agent builds out the full Mumford0 network over its lifetime.
  horizon_years: 12        # TOTAL welfare horizon (years). Build-then-watch sets
                           # this to 40 (10 build + 30 watch) via override.
  watch_credit: spread     # build-then-watch: how watch-phase welfare is credited
                           # to build decisions. 'spread' (default) = evenly across
                           # build-year steps (objective-preserving, removes the
                           # single-step critic spike); 'lump' = all on last build
                           # step (original decision B).
  build_years: null        # null => build every year (rebuild-yearly, original).
                           # Build-then-watch: set to 10 (routes built in years
                           # 0-9, network frozen for the rest of horizon_years
                           # while dynamics keep advancing). == n_routes_to_plan.
  reward_mode: integrated  # -sum_y C(s_y) (alpha-sensitive); 'delta' = old metric;
                           # 'integrated_advantage' = -(C(s_y)-C_ref) no-build
                           # baseline-subtracted (same alpha-sensitivity, far better
                           # signal-to-noise). Logged integrated_welfare is unchanged.

eval:
  csv: false
  n_routes: 12             # Mumford0 benchmark route count (geometry metadata)
  min_route_len: 2         # Mumford0 benchmark route-length bounds
  max_route_len: 15
  dataset:
    type: mumford
    path: datasets/mumford_dataset/Instances
    city: Mumford0

experiment:
  logdir: null

defaults:
  - experiment: standard
  - model: bestsofar_feb2023
  - _self_
